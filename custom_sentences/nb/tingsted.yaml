# Kopier til /config/custom_sentences/nb/tingsted.yaml i Home Assistant, og start HA på nytt.
language: "nb"
intents:
  TingstedFind:
    data:
      - sentences:
          - "hvor er [den|det|min|mitt|mine|vår|vårt|våre] {item}"
          - "hvor ligger [den|det|min|mitt|mine|vår|vårt|våre] {item}"
          - "hvor har vi [lagt] {item}"
          - "finn {item}"
          - "har vi [noen|en|et] {item}"
lists:
  item:
    wildcard: true
